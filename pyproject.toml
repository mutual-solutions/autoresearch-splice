[project]
name = "autoresearch-splice"
version = "0.1.0"
description = "Autonomous splice detection research — classical DSP, no neural networks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "matplotlib>=3.7.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "cryptography>=46.0.7",
]

[dependency-groups]
dev = [
    "coverage>=7.13.5",
    "pytest>=8.0.0",
]
